name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # CI=true (set by Actions) makes the Redis tests fail rather than skip without Docker;
      # ubuntu-latest has Docker.
      - run: ./gradlew build
