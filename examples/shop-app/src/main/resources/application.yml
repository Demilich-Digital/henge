server:
  port: 8080

spring:
  autoconfigure:
    # H2 is on the classpath, so Boot would build a DataSource of its own, opened on every process
    # before a lease is asked for. Inventory's pool is the lease's: see InventoryDatabase.
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

management:
  endpoint:
    health:
      probes:
        enabled: true

henge:
  leases:
    # Inventory's connection pool: however many processes host inventory, the database sees at
    # most 10 connections, 5 to a process.
    inventory-db:
      capacity: 10
      amount: 5
  rate-limits:
    # Each customer gets a burst of 3 messages, then one every 10 seconds.
    customer-notifications:
      permits: 1
      period: 10s
      capacity: 3
